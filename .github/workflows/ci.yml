name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: true
      - name: Go vet
        run: go vet ./...
      - name: Engine tests
        run: go test ./...
      - name: Cross-compile for Windows (desktop port)
        run: go build -trimpath -o warpscout-windows-amd64.exe .
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Provide stub google-services.json for CI
        # The real config is deliberately not in the repo (see .gitignore);
        # this stub only proves the build links and assembles.
        run: cp app/google-services.example.json app/google-services.json
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
